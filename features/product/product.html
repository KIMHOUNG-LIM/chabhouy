<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products &amp; Categories | ChabHouy</title>
  <meta name="description"
    content="Browse fresh local ingredients, delicious snacks, authentic noodles, and value packages from ChabHouy.">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="../../shared/variables.css">
  <link rel="stylesheet" href="../../shared/global.css">
  <link rel="stylesheet" href="../../components/navbar/navbar.css">
  <link rel="stylesheet" href="../../components/footer/footer.css">
  <link rel="stylesheet" href="../../shared/responsive.css">
  <link rel="stylesheet" href="product.css">
</head>

<body>
  <!-- Navigation Bar Container -->
  <div id="chbNavbarMount"></div>

  <!-- Product Page Main Content -->
  <main class="container-xl py-5">

    <!-- Page Header -->
    <div class="section-head text-center mb-4">
      <span class="eyebrow"><i class="bi bi-shop"></i> Explore Fresh Local Goods</span>
      <h1 class="section-title" id="chbCategoryTitle">Product Categories</h1>
      <p class="section-subtitle" id="chbCategorySubtitle">Explore our handpicked local snacks, noodles, natural
        ingredients, and savings packs.</p>
    </div>

    <!-- Category Filter Pills -->
    <div class="chb-filter-pills justify-content-center mb-4" id="chbCategoryPills">
      <button class="chb-filter-btn active" data-category="all">
        <i class="bi bi-grid-fill"></i> All Products
      </button>
      <button class="chb-filter-btn" data-category="ingredient">
        <i class="bi bi-flower2"></i> Ingredients
      </button>
      <button class="chb-filter-btn" data-category="snack">
        <i class="bi bi-cup-straw"></i> Snacks
      </button>
      <button class="chb-filter-btn" data-category="noodle">
        <i class="bi bi-egg-fried"></i> Noodles
      </button>
      <button class="chb-filter-btn" data-category="package">
        <i class="bi bi-box-seam"></i> Packages
      </button>
    </div>

    <!-- Mobile-only button that opens the filter panel -->
    <div class="mb-4 d-lg-none">
      <button class="chb-mobile-filter-toggle" id="chbMobileFilterToggle" type="button">
        <i class="bi bi-sliders"></i> Filters
      </button>
    </div>

    <!-- Page Body: Sidebar + Product Grid -->
    <div class="row g-4">

      <!-- ============ Sidebar Filters ============ -->
      <aside class="col-lg-3" id="chbFilterSidebar">
        <div class="chb-filter-panel">

          <div class="chb-filter-panel-head">
            <h2 class="chb-filter-title">Filters</h2>
            <!-- Close button, only shown on mobile off-canvas -->
            <button class="chb-filter-close d-lg-none" id="chbFilterClose" type="button" aria-label="Close filters">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <!-- Ingredients Filter -->
          <div class="chb-filter-group">
            <button class="chb-filter-group-head" data-toggle="chbIngredientList">
              Natural Ingredients <i class="bi bi-chevron-down"></i>
            </button>
            <div class="chb-filter-group-body" id="chbIngredientList">
              <!-- Ingredient checkboxes injected by product.js -->
            </div>
          </div>

          <!-- Province Filter -->
          <div class="chb-filter-group">
            <button class="chb-filter-group-head" data-toggle="chbProvinceList">
              Province / Source <i class="bi bi-chevron-down"></i>
            </button>
            <div class="chb-filter-group-body" id="chbProvinceList">
              <!-- Province checkboxes injected by product.js -->
            </div>
          </div>

          <!-- Price Range Filter -->
          <div class="chb-filter-group">
            <button class="chb-filter-group-head" data-toggle="chbPriceRange">
              Price Range <i class="bi bi-chevron-down"></i>
            </button>
            <div class="chb-filter-group-body" id="chbPriceRange">
              <div class="chb-price-inputs">
                <div class="chb-price-field">
                  <span>$</span>
                  <input type="number" id="chbPriceMin" min="0" placeholder="Min">
                </div>
                <span class="chb-price-dash">&ndash;</span>
                <div class="chb-price-field">
                  <span>$</span>
                  <input type="number" id="chbPriceMax" min="0" placeholder="Max">
                </div>
              </div>
              <button class="btn-brand w-100 justify-content-center mt-3" id="chbApplyPrice">Apply</button>
            </div>
          </div>

          <!-- Clear Filters -->
          <button class="chb-clear-filters" id="chbClearFilters">
            <i class="bi bi-arrow-counterclockwise"></i> Clear all filters
          </button>
        </div>
      </aside>

      <!-- Backdrop for mobile off-canvas filter panel -->
      <div class="chb-filter-backdrop" id="chbFilterBackdrop"></div>

      <!-- ============ Product Grid ============ -->
      <section class="col-lg-9">

        <!-- Active filter chips -->
        <div class="chb-active-chips" id="chbActiveChips"></div>

        <!-- Grid toolbar: result count + sort -->
        <div class="chb-grid-toolbar">
          <p class="chb-result-count" id="chbResultCount">Showing all products</p>
          <div class="chb-sort-box">
            <label for="chbSortSelect">Sort by:</label>
            <select id="chbSortSelect">
              <option value="best-selling">Best Selling</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
              <option value="newest">Newest</option>
            </select>
          </div>
        </div>

        <!-- Product card grid, populated by product.js -->
        <div class="chb-product-grid" id="chbProductGrid"></div>

        <!-- Empty state, hidden unless no products match -->
        <div class="chb-empty-state d-none" id="chbEmptyState">
          <i class="bi bi-emoji-frown"></i>
          <h3>No products match your filters</h3>
          <p>Try removing a filter to see more results.</p>
          <button class="btn-brand" id="chbEmptyClear">Clear all filters</button>
        </div>

        <!-- Pagination -->
        <nav class="chb-pagination" id="chbPagination" aria-label="Product pages"></nav>

      </section>
    </div>

  </main>

  <!-- Footer Container -->
  <div id="chbFooterMount"></div>

  <!-- JavaScript Libraries & Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../shared/main.js"></script>
  <script src="product.js"></script>
</body>

</html>
